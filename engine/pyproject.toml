[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-engine"
version = "0.2.0"
description = "Multi-market engine for quant research: L1 data, walk-forward model research, execution against bid/ask"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "websockets>=12.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  # Pinned exactly: the book's libraries are 0.x and their API still moves between releases.
  "ml4t-diagnostic==0.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["trading_engine*"]
